image: docker:27

variables:
  SERVER_USER: deployer
  IMAGE_NAME: $CI_REGISTRY_IMAGE

stages:
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop"
      variables:
        IMAGE_TAG: dev
        ENV_FILE: $ENV_DEV
        SERVER_ADDRESS: "${DEV_SERVER_IP}"
        DOCKER_COMPOSE_FILE: docker-compose.yml
        APP_DIR: /srv/dev/www/admin-dashboard-template
    - if: $CI_COMMIT_REF_NAME == "master"
      variables:
        IMAGE_TAG: prod
        ENV_FILE: $ENV_PROD
        SERVER_ADDRESS: "${PROD_SERVER_IP}"
        DOCKER_COMPOSE_FILE: docker-compose.yml
        APP_DIR: /srv/prod/www/admin-dashboard-template

.build_template:
  stage: build
  tags:
    - next-docker-runner
  script:
    - echo -n $CI_REGISTRY_PASSWORD | docker login --username $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - cp $ENV_FILE .env
    - docker build --pull --no-cache -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG

.deploy_template:
  tags:
    - next-docker-runner
  before_script:
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - echo "$RUNNER_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - cp $ENV_FILE .env
    - echo "IMAGE_TAG=$IMAGE_TAG" >> .env
    - echo "IMAGE_NAME=$CI_REGISTRY_IMAGE" >> .env
    - ssh $SERVER_USER@$SERVER_ADDRESS "mkdir -p $APP_DIR && rm -rf $APP_DIR/.env $APP_DIR/docker-compose*"
    - scp -r docker-compose/ $DOCKER_COMPOSE_FILE .env $SERVER_USER@$SERVER_ADDRESS:$APP_DIR/
  script:
    - |
      ssh deployer@$SERVER_ADDRESS /bin/bash -s << EOT
      echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin &&
      cd $APP_DIR && docker compose -f $DOCKER_COMPOSE_FILE pull && source .env &&
      docker compose -f $DOCKER_COMPOSE_FILE up -d && docker image prune -af && docker volume ls -qf dangling=true | xargs -r docker volume rm
      EOT

build-base-image:
  extends: .build_template
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^(master|develop)$/

deploy-to-dev:
  extends: .deploy_template
  stage: deploy
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop"

deploy-to-prod:
  extends: .deploy_template
  stage: deploy
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
      when: manual
